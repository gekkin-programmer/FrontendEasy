name: CI/CD — Frontend Pipeline

# ──────────────────────────────────────────────────────
# Trigger: every push to `dev`
#
# Flow:
#   push to dev
#     └── Next.js: lint → test → build
#                 │
#                 ▼  passes
#     fast-forward main ← dev
#                 │
#                 ▼
#     Dokploy auto-deploy (triggered by main push)
# ──────────────────────────────────────────────────────

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Next.js Frontend ───────────────────────
  frontend-checks:
    name: Next.js — Lint · Test · Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://eazypostv2.onrender.com/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test -- --passWithNoTests --ci

      - name: Build
        run: pnpm build

  # ── Job 2: Promote dev → main ─────────────────────
  promote-to-main:
    name: Promote dev → main
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [frontend-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to dev
        run: |
          git fetch origin main
          git checkout main
          git merge origin/dev --ff-only
          git push origin main

  # ── Job 3: Publish Docker Image ───────────────────
  build-and-push-docker:
    name: Publish Docker image to GHCR
    needs: [promote-to-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gekkin-programmer/eazypost-frontend

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/gekkin-programmer/eazypost-frontend:latest
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://eazypostv2.onrender.com/api
            NEXT_PUBLIC_APP_URL=https://eazypost.cm
