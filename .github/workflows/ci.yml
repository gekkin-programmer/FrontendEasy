name: CI/CD — Frontend Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend-checks:
    name: Next.js — Lint · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  build-and-push:
    name: Build Docker Image → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [frontend-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gekkin-programmer/eazypost-frontend:latest
          build-args: |
            NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max

  promote-to-main:
    name: Promote dev → main
    needs: [build-and-push]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to dev
        run: |
          git fetch origin main
          git checkout main
          git merge origin/dev --ff-only
          git push origin main

  deploy-to-dokploy:
    name: Trigger Dokploy — pull new image
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via webhook
        run: |
          if [ -z "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            echo "DOKPLOY_WEBHOOK_URL is not set in GitHub Secrets."
            exit 1
          fi
          curl -s -o /dev/null -w "Dokploy status: %{http_code}\n" \
            --max-time 10 \
            -X GET "${{ secrets.DOKPLOY_WEBHOOK_URL }}" || echo "Deploy triggered (server is processing)"
