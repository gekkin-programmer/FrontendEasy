name: CI/CD — Frontend Pipeline

# ──────────────────────────────────────────────────────
# Trigger: every push to `dev` (+ checks on PRs to dev)
#
# Flow:
#   push to dev
#     └── Next.js: lint → test → build
#                 │
#                 ▼  passes
#     Build Docker image on GitHub Actions
#     Push to ghcr.io/gekkin-programmer/eazypost-frontend:latest
#                 │
#                 ▼
#     fast-forward main ← dev
#                 │
#                 ▼
#     POST Dokploy webhook → pull new image → redeploy
#
# Security rules (lessons from BackendEasy incidents):
#   - Never interpolate user-controlled values (PR titles/bodies, model
#     output, …) into run: scripts with ${{ }} — pass them via env: only.
#   - Heredocs to $GITHUB_OUTPUT must use random delimiters.
#   - Required secrets are guarded: missing secret = loud failure, not a no-op.
# ──────────────────────────────────────────────────────

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Next.js Checks ─────────────────────────
  frontend-checks:
    name: Next.js — Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pnpm version comes from package.json "packageManager" (pnpm@9.15.9) —
      # do not hardcode a different major here, the lockfile is v9.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm run test --passWithNoTests --ci

      - name: Build
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ── Job 2: Docker Build → GHCR ───────────────────
  build-and-push:
    name: Build Docker Image → GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [frontend-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gekkin-programmer/eazypost-frontend:latest
          build-args: |
            NODE_OPTIONS=--max-old-space-size=4096
            NEXT_PUBLIC_API_URL=https://backend-eazypost.mbokofit.com
            NEXT_PUBLIC_APP_URL=https://eazypost.cm
            NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=phc_sfHAxeZDRp84KG8Hcd4c6bgZhrfjvzv46W3EAjjub2yQ
            NEXT_PUBLIC_POSTHOG_HOST=https://eu.i.posthog.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Promote dev → main ─────────────────────
  promote-to-main:
    name: Promote dev → main
    needs: [build-and-push]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to dev
        run: |
          git fetch origin main
          git checkout main
          git merge origin/dev --ff-only
          git push origin main

