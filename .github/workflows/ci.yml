name: CI/CD — Frontend Pipeline

# ──────────────────────────────────────────────────────
# Trigger: every push to `dev`
#
# Flow:
#   push to dev
#     └── Next.js: lint → test → build (type-check only)
#                 │
#                 ▼  passes
#     fast-forward main ← dev
#                 │
#                 ▼
#     Build Docker image on GitHub Actions (7 GB RAM)
#     Push → ghcr.io/gekkin-programmer/eazypost-frontend:latest
#                 │
#                 ▼
#     Webhook → Dokploy pulls new image & redeploys
# ──────────────────────────────────────────────────────

on:
  push:
    branches: [dev]

jobs:
  # ── Job 1: Next.js checks ─────────────────────────
  frontend-checks:
    name: Next.js — Lint · Test · Build
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: https://backend-eazypost.mbokofit.com
      NEXT_PUBLIC_APP_URL: https://eazypost.cm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test -- --passWithNoTests --ci

      - name: Build
        run: pnpm build

  # ── Job 2: Promote dev → main ─────────────────────
  promote-to-main:
    name: Promote dev → main
    needs: [frontend-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Promote dev → main
        run: |
          git fetch origin
          git checkout -B main origin/main
          git reset --hard origin/dev
          git push origin main --force-with-lease

  # ── Job 3: Build Docker image & push to GHCR ──────
  build-and-push:
    name: Build Docker image → GHCR
    needs: [promote-to-main]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/gekkin-programmer/eazypost-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://backend-eazypost.mbokofit.com
            NEXT_PUBLIC_APP_URL=https://eazypost.cm
          # GitHub Actions layer cache — makes repeat builds ~3x faster
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy redeploy
        run: |
          curl -s -X POST \
            "https://admin.zylo-platform.cloud/api/webhook?token=${{ secrets.DOKPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            --fail-with-body || echo "Webhook call failed — check token"
