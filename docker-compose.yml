services:
  # ── Redis (for BullMQ queues) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: easypost_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easypost_network

  # ── NestJS Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./Nestjs_Backend
      dockerfile: Dockerfile
    container_name: easypost_backend
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - ./Nestjs_Backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      # DATABASE_URL comes from Nestjs_Backend/.env (your Neon DB)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme}
      FRONTEND_URL: ${DOMAIN_URL:-http://localhost}
      CORS_ORIGINS: ${DOMAIN_URL:-http://localhost}
    networks:
      - easypost_network

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${DOMAIN_URL:-http://localhost}/api
    container_name: easypost_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
    networks:
      - easypost_network

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: easypost_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - easypost_network

volumes:
  redis_data:
  certbot_webroot:

networks:
  easypost_network:
    driver: bridge
