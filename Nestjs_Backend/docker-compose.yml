version: '3.8'

networks:
  dokploy-network:
    external: true

services:
  backend:
    build:
      context: ./Nestjs_Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '3000'
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend-eazypost.rule=Host(`backend-eazypost.mbokofit.com`)"
      - "traefik.http.routers.backend-eazypost.entrypoints=websecure"
      - "traefik.http.routers.backend-eazypost.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend-eazypost.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    environment:
      # Database (Neon serverless)
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}

      # Redis (BullMQ queues)
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_TLS: ${REDIS_TLS}

      # AI
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}

      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}

      # Media
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Payments
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN}

      # App
      FRONTEND_URL: ${FRONTEND_URL}
      PORT: ${PORT:-3000}

  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - '8000'
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ml-eazypost.rule=Host(`eazypost-ml-service.mbokofit.com`)"
      - "traefik.http.routers.ml-eazypost.entrypoints=websecure"
      - "traefik.http.routers.ml-eazypost.tls.certresolver=letsencrypt"
      - "traefik.http.services.ml-eazypost.loadbalancer.server.port=8000"
      - "traefik.docker.network=dokploy-network"
