name: CI/CD — Backend Pipeline

# ──────────────────────────────────────────────────────
# Trigger: every push to `dev`
#
# Flow:
#   push to dev
#     └── NestJS: lint → test → build
#                 │
#                 ▼  passes
#     Build Docker image on GitHub Actions (7 GB RAM — no OOM)
#     Push to ghcr.io/gekkin-programmer/eazypost-backend:latest
#                 │
#                 ▼
#     fast-forward main ← dev
#                 │
#                 ▼
#     POST Dokploy webhook → pull new image → redeploy
# ──────────────────────────────────────────────────────

on:
  push:
    branches: [dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Job 1: NestJS Checks ──────────────────────────
  backend-checks:
    name: NestJS — Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:password@localhost/db"
          DIRECT_URL: "postgresql://dummy:password@localhost/db"

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test --passWithNoTests --ci

      - name: Build
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

  # ── Job 2: Docker Build → GHCR ───────────────────
  build-and-push:
    name: Build Docker Image → GHCR
    needs: [backend-checks]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/gekkin-programmer/eazypost-backend:latest
          # GitHub Actions runner has 7 GB RAM — build with full heap
          build-args: |
            NODE_OPTIONS=--max-old-space-size=4096
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Promote dev → main ─────────────────────
  promote-to-main:
    name: Promote dev → main
    needs: [build-and-push]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward main to dev
        run: |
          git fetch origin main
          git checkout main
          git merge origin/dev --ff-only
          git push origin main

  # ── Job 4: Trigger Dokploy Redeploy ──────────────
  deploy-to-dokploy:
    name: Trigger Dokploy — pull new image
    needs: [build-and-push]
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via refresh token
        run: |
          curl -s -o /dev/null -w "Dokploy status: %{http_code}\n" \
            --max-time 10 \
            -X GET "https://admin.zylo-platform.cloud/api/deploy/bnHUWrgI-6BCfwaNICm18" || echo "Deploy triggered (server is processing)"
