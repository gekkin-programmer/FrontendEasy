services:
  backend:
    image: ghcr.io/gekkin-programmer/eazypost-backend:latest
    container_name: easypost_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # NOTE: You should set DATABASE_URL and all other production secrets 
      # directly in the Dokploy Environment Variables UI!

  redis:
    image: redis:7-alpine
    container_name: easypost_redis
    restart: always
    volumes:
      - redis_data:/data

volumes:
  redis_data:
