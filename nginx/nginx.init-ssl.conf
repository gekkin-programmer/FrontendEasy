# Temporary config — used ONLY to obtain the initial SSL certificate.
# After running certbot, swap this out for the real nginx.conf.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'EasyPost — waiting for SSL setup';
        add_header Content-Type text/plain;
    }
}
